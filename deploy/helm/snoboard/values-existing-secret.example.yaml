# Example overlay: helm template snoboard deploy/helm/snoboard -f values-existing-secret.example.yaml
# The Secret snoboard-secrets must exist in the release namespace and contain every secretFiles key.
existingSecret: snoboard-secrets
env:
  SNOBOARD_REPO_URL: https://github.com/acme/initiatives.git
  SNOBOARD_REFRESH_SECONDS: "120"
  SNOBOARD_AUTH_MODES: password
  SNOBOARD_AUTH_ALLOW_NONE: "false"
  SNOBOARD_PUBLIC_URL: https://board.example.com
